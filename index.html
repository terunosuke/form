<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>型枠材料拾い出し(初期バージョン)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232b3a4a'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <header>
    <h1>型枠材料拾い出し</h1>
    <p id="disclaimer" class="disclaimer"></p>
  </header>

  <main>
    <section id="project-section">
      <h2>1. プロジェクト</h2>
      <div class="grid">
        <label>プロジェクト名 <input id="prj-name" value="無題プロジェクト" /></label>
        <label>現場名 <input id="prj-site" /></label>
        <label>工区 <input id="prj-section" /></label>
        <label>打設区分 <input id="prj-pour" /></label>
      </div>
      <div class="row">
        <button id="btn-save" type="button">プロジェクトを保存(JSON)</button>
        <label class="file-label">保存ファイルを読み込む
          <input id="file-load" type="file" accept=".json" />
        </label>
      </div>
    </section>

    <section id="materials-section">
      <h2>2. 材料条件</h2>
      <p class="hint">すべての規格・ピッチは施工計画に基づいて入力してください(自動設計は行いません)。</p>
      <div id="materials-form"></div>
    </section>

    <section id="members-section">
      <h2>3. 構造部材</h2>
      <div class="row">
        <select id="member-kind">
          <option value="wall">壁・擁壁</option>
          <option value="column">柱</option>
          <option value="beam">梁</option>
          <option value="slab">スラブ</option>
          <option value="footing">フーチング</option>
        </select>
        <button id="btn-add-member" type="button">部材を追加</button>
      </div>
      <div id="members-list"></div>
    </section>

    <section id="run-section">
      <div class="row">
        <button id="btn-run" type="button" class="primary">拾い出しを実行</button>
      </div>
      <div id="results"></div>
    </section>
  </main>

  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
